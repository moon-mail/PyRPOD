# PyRPOD centralized test manifest
# ================================
# Source of truth for INVENTORY-level metadata about every test asset in
# tests/ (description, subsystem, category, how it is executed, how far its
# development has progressed).  Pytest remains the source of truth for
# EXECUTION outcomes (pass / fail / skip); those never appear here.
#
# Regenerate tests/README.md and the HTML execution report with:
#     python scripts/generate_test_dashboard.py
#
# Schema (one entry per file under tests/):
#   path                     repo-relative path, POSIX separators (required)
#   description              one-line human-readable purpose (required)
#   subsystem                logging | mdao | mission | plume | rpod | tooling
#   category                 unit | integration | verification
#   execution_mode           automated | manual
#   development_status       implemented | placeholder | needs_review
#                            | blocked | archived | deprecated
#   collection_status        collected | ignored | manual | archived
#   reference                publication / benchmark, or null
#   manual_command           exact command for manual assets, or null
#   collection_ignore_reason why the asset is absent from the pytest run,
#                            or null for collection_status: collected
#
# Helper modules that define no tests are intentionally absent:
#   tests/conftest.py, tests/plume/plume_figure_utils.py,
#   tests/plume/plume_impingement_utils.py.

