# ISS-representative solar-panel plume-impingement case.
#
# An idealized 22 m x 12 m flat panel standing in for one ISS solar-array
# wing, centered at the origin in the X-Y plane with its normal along +Z.
# A single argon round jet (D = 1 m, S0 = 2.0, T0 = 200 K, Tw = 300 K, fully
# diffuse -- the Cai 2016 Section-4 conditions, reused so the thruster is a
# verified one) stands off on the +Z side and is TRANSLATED parallel to the
# panel by the study layer.
#
# Panel-local axes used throughout the studies in study/:
#     u = global +X, longitudinal, the 22 m dimension
#     v = global +Y, transverse,   the 12 m dimension
#     n = global +Z, panel normal, pointing toward the plume source
#
# Assets are generated by stl/generate_panel.py; the study YAML files in
# study/ add the sweep, the plume-model selection and the Knudsen metadata
# on top of this file, which keeps owning every case asset.
#
# See case/plume/iss_panel_thesis/README.md and
# docs/plume_validation_study.md.

# Visiting Vehicle for RPOD analysis
[vv]
stl_lm = cylinder_transformed.stl
stl_thruster = mold_funnel_transformed.stl

# Target Vehicle for RPOD analysis
[tv]
stl = iss_panel.stl

# surface wall temperature (Kelvin): Tw/T0 = 1.5
surface_temp = 300

# proportion of diffuse particle reflections [0, 1]
sigma = 1

# check plume constraints? 0 or 1
check_constraints = 0

# max heat flux integral (J/m^2)
heat_flux_load = inf
heat_flux_window_size = 1

# max heat flux rate (W/m^2)
heat_flux = inf

# max pressure load
normal_pressure_load = inf
normal_pressure_window_size = inf

# max normal pressure (N/m^2)
normal_pressure = inf

# max shear pressure (N/m^2)
shear_pressure = inf

# Plume kinetics and interactions models
[pm]
# Gas kinetics model. 'Simplified' -> SimplifiedGasKinetics,
# 'Collisionless' -> CollisionlessGasKinetics (the full Cai & Wang 2012
# model). A study's plume_model.name selects the model for its own run
# without modifying this file; this value is the case default.
kinetics = Simplified

# Gas-surface interaction model
surface_interaction = Maxwellian

# Jet Firing History
[jfh]
# Placeholder: every study in study/ GENERATES its own prescribed firing
# history into its own output directory.
jfh = generated_by_study.A

# Thruster configuration data.
[tcd]
# Thruster Configuration File - single head-on thruster, no cant.
tcf = tcf_1_argon.txt

# Thruster Definition File - argon at the Cai 2016 Section-4 conditions.
tdf = tdf.csv

# Parameters for scaling plume geometry.
[plume]
# Gating geometry, sized so the wedge and radius never clip the panel at any
# swept pose. The farthest panel corner from the most offset source
# (L = 2 m, u = -9 m) sits ~21 m away and ~84 deg off-axis, so:
radius = 40
wedge_theta = 1.55
